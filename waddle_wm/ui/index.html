<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visual World Model</title>
<meta name="description" content="Visual world model verification and execution." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #080808;
    --panel-sub: #101010;
    --line: #222222;
    --line-subtle: #181818;
    --line-focus: #ffffff;
    --ink: #f4f4f5;
    --ink-muted: #a1a1aa;
    --ink-faint: #71717a;
    --font-serif: 'Newsreader', Charter, Georgia, serif;
    --font-mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace;
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* Header */
  header {
    height: 48px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .paper-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
    background: var(--panel-sub);
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  button.btn-academic {
    background: var(--panel-sub);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 11.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
  }

  button.btn-academic:hover:not(:disabled) {
    background: #1a1a1a;
    border-color: var(--line-focus);
    color: #ffffff;
  }

  button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Main Layout */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(480px, 1.15fr) minmax(400px, 0.85fr);
    gap: 12px;
    padding: 12px;
    min-height: 0;
  }

  /* Left Panel: Simulation Viewport */
  .figure-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .panel-caption {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-muted);
  }

  .caption-title {
    font-weight: 500;
    color: var(--ink);
  }

  .status-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: var(--radius);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: 1px solid var(--line);
    background: var(--panel-sub);
    color: var(--ink-muted);
  }

  .status-tag.approved { background: #ffffff; color: #000000; border-color: #ffffff; font-weight: 600; }
  .status-tag.rejected { background: #181818; color: #ffffff; border-color: #444444; }

  .viewport-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    position: relative;
    overflow: hidden;
  }

  .viewport-area video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  .viewport-area video.active {
    display: block;
  }

  .viewport-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--line);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .outcome-stamp {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    border-radius: var(--radius);
    display: none;
    white-space: nowrap;
    border: 1px solid;
    background: #000000;
    box-shadow: 0 4px 16px rgba(0,0,0,0.8);
  }

  .outcome-stamp.active { display: block; }
  .outcome-stamp.success { border-color: #ffffff; color: #ffffff; }
  .outcome-stamp.failure { border-color: #555555; color: #888888; }

  /* Telemetry Table */
  .telemetry-table {
    padding: 6px 14px;
    background: var(--panel);
    border-top: 1px solid var(--line-subtle);
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
  }

  .telemetry-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .telemetry-heading {
    font-size: 9px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .telemetry-value {
    font-weight: 500;
    color: var(--ink);
  }

  /* Right Panel: Chat / Verification Trace */
  .trace-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .trace-stream {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }

  /* Trace Items */
  .trace-user {
    align-self: flex-end;
    background: #ffffff;
    color: #000000;
    padding: 6px 11px;
    border-radius: var(--radius);
    max-width: 85%;
    font-family: var(--font-serif);
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.4;
  }

  .trace-system {
    align-self: flex-start;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .trace-card {
    background: var(--panel-sub);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 13px;
  }

  .trace-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 3px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink);
  }

  .trace-note {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
    border-left: 2px solid var(--line);
    padding-left: 6px;
  }

  .trace-note.repaired { border-left-color: #ffffff; color: #ffffff; }
  .trace-note.rejected { border-left-color: #666666; color: #a1a1aa; }

  /* Form Footer */
  .prompt-area {
    padding: 8px 12px 10px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .prompt-input {
    flex: 1;
    background: #000000;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 11px;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 14px;
    transition: border-color 0.15s ease;
  }

  .prompt-input:focus {
    outline: none;
    border-color: var(--line-focus);
  }

  button.btn-submit {
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: var(--radius);
    padding: 0 14px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.btn-submit:hover:not(:disabled) {
    background: #e4e4e7;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="paper-title">Visual World Model</div>
    <div class="header-actions">
      <span class="meta-tag" id="seedDisplay">seed 0</span>
      <button type="button" class="btn-academic" id="resetBtn" title="Reset simulator state">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        Reset
      </button>
      <button type="button" class="btn-academic" id="replayBtn" disabled title="Replay previous episode">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Replay
      </button>
    </div>
  </header>

  <main>
    <!-- Left: Simulation Viewport -->
    <section class="figure-panel">
      <div class="panel-caption">
        <span class="caption-title">Simulation</span>
        <span class="status-tag" id="viewportStatus">Ready</span>
      </div>

      <div class="viewport-area" id="viewportBox">
        <video id="simVideo" muted playsinline loop></video>
        <div class="viewport-placeholder" id="viewportPlaceholder">
          <div class="spinner" id="loadingSpinner" style="display:none;"></div>
          <span id="placeholderText">Ready</span>
        </div>
        <div class="outcome-stamp" id="outcomeStamp"></div>
      </div>

      <div class="telemetry-table">
        <div class="telemetry-col">
          <span class="telemetry-heading">Target Error</span>
          <span class="telemetry-value" id="telDist">—</span>
        </div>
        <div class="telemetry-col">
          <span class="telemetry-heading">Max Lift</span>
          <span class="telemetry-value" id="telLift">—</span>
        </div>
        <div class="telemetry-col">
          <span class="telemetry-heading">Outcome</span>
          <span class="telemetry-value" id="telDecision">—</span>
        </div>
      </div>
    </section>

    <!-- Right: Chat & Verification Trace -->
    <section class="trace-panel">
      <div class="panel-caption">
        <span class="caption-title">Trace</span>
      </div>

      <div class="trace-stream" id="chatThread"></div>

      <form class="prompt-area" id="promptForm">
        <input type="text" id="promptInput" class="prompt-input" placeholder="Enter instruction..." autocomplete="off" />
        <button type="submit" id="sendBtn" class="btn-submit">Execute</button>
      </form>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const chatThread = $("chatThread");
const simVideo = $("simVideo");
const placeholder = $("viewportPlaceholder");
const placeholderText = $("placeholderText");
const loadingSpinner = $("loadingSpinner");
const outcomeStamp = $("outcomeStamp");
const viewportStatus = $("viewportStatus");

let currentVideoUrl = null;
let isBusy = false;
let abortController = null;

function appendSystemCard(contentHtml) {
  const wrapper = document.createElement("div");
  wrapper.className = "trace-system";
  wrapper.innerHTML = contentHtml;
  chatThread.appendChild(wrapper);
  chatThread.scrollTop = chatThread.scrollHeight;
}

function appendUserMessage(text) {
  const msg = document.createElement("div");
  msg.className = "trace-user";
  msg.textContent = text;
  chatThread.appendChild(msg);
  chatThread.scrollTop = chatThread.scrollHeight;
}

function setSimLoading(text = "Evaluating...") {
  simVideo.classList.remove("active");
  placeholder.style.display = "flex";
  loadingSpinner.style.display = "block";
  placeholderText.textContent = text;
  viewportStatus.textContent = "Processing";
}

function showSimVideo(src) {
  if (!src) return;
  currentVideoUrl = src;
  loadingSpinner.style.display = "none";
  placeholder.style.display = "none";
  simVideo.src = `${src}${src.includes("?") ? "&" : "?"}t=${Date.now()}`;
  simVideo.classList.add("active");
  simVideo.play().catch(() => {});
  viewportStatus.textContent = "Playback";
  $("replayBtn").disabled = false;
}

function setOutcome(isSuccess, failureMode, targetDistance) {
  outcomeStamp.className = "outcome-stamp active " + (isSuccess ? "success" : "failure");
  const distText = targetDistance != null ? `${(Number(targetDistance) * 1000).toFixed(1)} mm` : "";
  if (isSuccess) {
    outcomeStamp.textContent = `SUCCESS · ${distText}`;
    $("telDecision").textContent = "Success";
    $("telDecision").style.color = "#ffffff";
  } else {
    outcomeStamp.textContent = `FAILURE (${failureMode || "MISSED"}) · ${distText}`;
    $("telDecision").textContent = "Failure";
    $("telDecision").style.color = "#888888";
  }
  if (targetDistance != null) $("telDist").textContent = distText || "—";
}

function clearOutcome() {
  outcomeStamp.className = "outcome-stamp";
  outcomeStamp.textContent = "";
  $("telDist").textContent = "—";
  $("telLift").textContent = "—";
  $("telDecision").textContent = "—";
}

const EVENT_HANDLERS = {
  observed(d) {
    const objects = d.detections ? d.detections.map(x => x.label).join(', ') : '';
    if (!objects) return;
    appendSystemCard(`
      <div class="trace-card">
        <div class="trace-card-header">
          <span>Perception</span>
          <span class="status-tag">Observed</span>
        </div>
        <div style="font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted);">Detected: ${objects}</div>
      </div>
    `);
  },
  plan(d) {
    if (d.action === "abstain") return;
    const isRepair = d.kind === "repair";
    const headerTitle = isRepair ? `Repaired Plan (Turn ${Number(d.round || 0) + 1})` : "Proposed Plan";
    const tagText = isRepair ? "Fixed" : (d.action || "Execute");
    const note = d.note ? `<div class="trace-note ${isRepair ? 'repaired' : ''}">${d.note}</div>` : "";
    appendSystemCard(`
      <div class="trace-card" style="${isRepair ? 'border-color: #666666;' : ''}">
        <div class="trace-card-header">
          <span>${headerTitle}</span>
          <span class="status-tag ${isRepair ? 'approved' : ''}">${tagText}</span>
        </div>
        <div>Intent: <i>${d.intent || "—"}</i></div>
        ${note}
      </div>
    `);
    if (isRepair) {
      placeholderText.textContent = "Verifying repaired trajectory...";
    }
  },
  step(d) {
    appendSystemCard(`
      <div class="trace-card">
        <div class="trace-card-header">
          <span>Step ${d.index} of ${d.total}</span>
          <span class="status-tag">Execute</span>
        </div>
        <div>Moving ${d.object} → ${d.destination}</div>
      </div>
    `);
  },
  verdict(d) {
    const isApproved = d.approved === true;
    const pSuccess = Math.round(Number(d.imagined_success_probability || 0) * 100);
    const statusClass = isApproved ? "approved" : "rejected";
    const statusText = isApproved ? "Approved" : "Rejected";
    
    if (!isApproved) {
      const diag = d.likely_failure || "predicted trajectory failure";
      const suggestion = d.verifier_suggestion ? `— ${d.verifier_suggestion}` : "";
      placeholderText.textContent = `⚠️ Predicted Miss (${pSuccess}%) · ${diag} · Closed-Loop Repairing...`;
      viewportStatus.textContent = "Plan Rejected";
      
      appendSystemCard(`
        <div class="trace-card" style="border-color: #555555; background: #0c0c0c;">
          <div class="trace-card-header">
            <span>⚠️ World Model Score: ${pSuccess}%</span>
            <span class="status-tag rejected">${statusText}</span>
          </div>
          <div class="trace-note rejected">
            <b>Predicted Miss:</b> ${diag}
            <br><b>Verifier Feedback:</b> <i>${suggestion || "re-align grasp / destination waypoints"}</i>
          </div>
        </div>
      `);
    } else {
      placeholderText.textContent = `Plan Approved (${pSuccess}%) · Simulating physics...`;
      appendSystemCard(`
        <div class="trace-card">
          <div class="trace-card-header">
            <span>World Model Score: ${pSuccess}%</span>
            <span class="status-tag approved">${statusText}</span>
          </div>
        </div>
      `);
    }
  },
  executing(d) {
    viewportStatus.textContent = "Executing";
    placeholderText.textContent = "Executing physical rollout...";
  },
  retrying(d) {
    appendSystemCard(`
      <div class="trace-card">
        <div class="trace-card-header">
          <span>Re-centering Grasp</span>
          <span class="status-tag">Retry</span>
        </div>
        <div style="color: var(--ink-muted); font-size: 12px;">Re-perceived nudged block and retrying grasp...</div>
      </div>
    `);
  },
  executed(d) {
    if (d.max_block_z != null) $("telLift").textContent = `${(Number(d.max_block_z) * 100).toFixed(1)} cm`;
    if (d.target_distance != null) $("telDist").textContent = `${(Number(d.target_distance) * 1000).toFixed(1)} mm`;
  },
  "arm-done"(d) {
    if (d.video) showSimVideo(d.video);
    const execution = d.execution || {};
    const isSuccess = execution.success === true || (Array.isArray(execution.steps) && execution.steps.every(s => s.success));
    const lastStep = Array.isArray(execution.steps) ? execution.steps.at(-1) : execution;
    setOutcome(isSuccess, lastStep?.failure_mode, lastStep?.target_distance);
  },
  done(d) {
    if (d.video) showSimVideo(d.video);
    viewportStatus.textContent = "Idle";
  },
  error(d) {
    appendSystemCard(`
      <div class="trace-card" style="border-color: #555555;">
        <div class="trace-card-header">
          <span>Error</span>
          <span class="status-tag rejected">Error</span>
        </div>
        <div style="color: #cccccc;">${d.reason || "Unknown execution error"}</div>
      </div>
    `);
  }
};

async function sendInstruction(instruction) {
  if (isBusy || !instruction) return;
  isBusy = true;
  $("sendBtn").disabled = true;
  clearOutcome();
  setSimLoading("Evaluating...");
  appendUserMessage(instruction);

  const ac = new AbortController();
  abortController = ac;

  try {
    const res = await fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ instruction }),
      signal: ac.signal
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const line = buffer.slice(0, cut).replace(/^data: /, "");
        buffer = buffer.slice(cut + 2);
        if (!line) continue;
        try {
          const payload = JSON.parse(line);
          const fn = EVENT_HANDLERS[payload.event];
          if (fn) fn(payload);
        } catch (err) {
          console.error("Malformed SSE line:", line, err);
        }
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") {
      EVENT_HANDLERS.error({ reason: err.message });
    }
  } finally {
    isBusy = false;
    $("sendBtn").disabled = false;
    $("promptInput").focus();
  }
}

$("promptForm").addEventListener("submit", e => {
  e.preventDefault();
  const val = $("promptInput").value.trim();
  $("promptInput").value = "";
  if (val) sendInstruction(val);
});

$("resetBtn").addEventListener("click", async () => {
  abortController?.abort();
  $("resetBtn").disabled = true;
  clearOutcome();
  setSimLoading("Resetting scene...");
  try {
    const snap = await (await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })).json();
    $("seedDisplay").textContent = `seed ${snap.seed}`;
    if (snap.video) showSimVideo(snap.video);
  } catch (err) {
    console.error("Reset failed:", err);
  } finally {
    $("resetBtn").disabled = false;
  }
});

$("replayBtn").addEventListener("click", () => {
  if (currentVideoUrl) showSimVideo(currentVideoUrl);
});

fetch("/api/scene")
  .then(r => r.json())
  .then(s => {
    $("seedDisplay").textContent = `seed ${s.seed}`;
    if (s.video) showSimVideo(s.video);
  })
  .catch(() => {});
</script>
</body>
</html>
