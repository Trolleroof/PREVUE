<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulator</title>
<style>
  :root {
    --bg: #000; --panel: #0a0a0a; --line: #333; --ink: #fff; --dim: #888;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  .pair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 18px 18px 0; min-height: 0; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
          display: flex; flex-direction: column; min-height: 0; }
  .pane.wm { border-color: var(--ink); }
  .who h2 { margin: 0; font-size: 18px; font-weight: 560; }
  .viewport { flex: 1 1 auto; margin-top: 12px; display: grid; place-items: center; background: #000;
              border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; min-height: 0; }
  .viewport video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .stream-name { position: absolute; top: 12px; left: 12px; z-index: 2;
                 font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase;
                 padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: #000c; }
  .empty { color: var(--dim); font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase;
           display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .empty.busy { position: absolute; inset: 0; justify-content: center; }
  .spin { width: 28px; height: 28px; border: 2px solid var(--line); border-top-color: var(--ink);
          border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stamp { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px;
           font: 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
           padding: 10px 15px; border-radius: 9px; border: 1px solid var(--line); background: #000c;
           backdrop-filter: blur(6px); display: none; }
  .stamp.on { display: block; }
  .stamp.ok { color: var(--ink); border-color: var(--ink); }
  .stamp.no { color: var(--dim); }
  .rail { margin-top: 10px; flex: 0 0 auto; max-height: 140px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .step { border-left: 2px solid var(--line); padding-left: 11px; font-size: 13px; }
  .step.ok { border-left-color: var(--ink); }
  .step.no { border-left-color: var(--dim); }
  .step .k { font: 10.5px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  .foot { display: flex; align-items: center; gap: 10px; padding: 12px 18px 16px; flex-shrink: 0; }
  button { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 9px;
           padding: 7px 13px; font-size: 13px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  form { display: flex; gap: 8px; flex: 1; }
  input { flex: 1; background: #000; border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 14px; color: var(--ink); font-size: 14px; }
  input:focus { outline: none; border-color: var(--ink); }
  #seed { font: 12px var(--mono); color: var(--dim); }
</style>
</head>
<body>
  <div class="pair">
    <section class="pane wm">
      <div class="who"><h2>World model</h2></div>
      <div class="viewport" id="viewWm" data-arm="world-model">
        <div class="stream-name">World model</div>
        <div class="empty" data-idle>—</div>
        <div class="stamp" id="stampWm"></div>
      </div>
      <div class="rail" id="railWm"></div>
    </section>
    <section class="pane">
      <div class="who"><h2>Baseline</h2></div>
      <div class="viewport" id="viewNone" data-arm="none">
        <div class="stream-name">Baseline</div>
        <div class="empty" data-idle>—</div>
        <div class="stamp" id="stampNone"></div>
      </div>
      <div class="rail" id="railNone"></div>
    </section>
  </div>
  <div class="foot">
    <button type="button" id="reset">Reset</button>
    <button type="button" id="replay" disabled>Replay</button>
    <span id="seed"></span>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Command…" />
      <button id="send">Send</button>
    </form>
  </div>

<script>
const $ = id => document.getElementById(id);
const views = { "world-model": $("viewWm"), none: $("viewNone") };
const stamps = { "world-model": $("stampWm"), none: $("stampNone") };
const rails = { "world-model": $("railWm"), none: $("railNone") };
let busy = false, lastVideos = {}, lastStamps = {}, abortCommand = null, currentArm = "world-model";

function round(v, n = 3) { return Number(v).toFixed(n); }

function rail(arm, kind, key, text) {
  const el = document.createElement("div");
  el.className = "step " + (kind || "");
  el.innerHTML = `<div class="k">${key}</div><div>${text}</div>`;
  rails[arm].appendChild(el);
}

function clearRails() {
  Object.values(rails).forEach(r => { r.innerHTML = ""; });
  Object.values(stamps).forEach(s => { s.className = "stamp"; s.textContent = ""; });
}

function setStamp(arm, execution) {
  const stamp = stamps[arm];
  if (!stamp || !execution) return;
  const last = Array.isArray(execution.steps) ? execution.steps.at(-1) : execution;
  if (!last || last.success === undefined) return;
  const dist = `${round(last.target_distance)} m from the pad`;
  stamp.textContent = last.success
    ? `success · ${dist}`
    : `failure · ${(last.failure_mode || "missed").replaceAll("_", " ")} · ${dist}`;
  stamp.className = "stamp on " + (last.success ? "ok" : "no");
  lastStamps[arm] = { className: stamp.className, text: stamp.textContent };
}

function showEmpty(message, el) {
  const targets = el ? [el] : Object.values(views);
  targets.forEach(box => {
    [...box.querySelectorAll("video, .empty")].forEach(n => n.remove());
    const idle = document.createElement("div");
    const loading = /^loading$/i.test(message);
    idle.className = "empty" + (loading ? " busy" : "");
    if (loading) {
      idle.innerHTML = `<div class="spin" aria-hidden="true"></div><span>loading</span>`;
    } else {
      idle.textContent = message;
    }
    box.insertBefore(idle, box.querySelector(".stamp"));
  });
}

function showVideo(src, el) {
  if (!src || !el) return;
  [...el.querySelectorAll("video, .empty")].forEach(n => n.remove());
  const video = document.createElement("video");
  Object.assign(video, { autoplay: true, loop: true, muted: true, playsInline: true, controls: false });
  video.dataset.arm = el.dataset.arm || "";
  video.src = `${src}${src.includes("?") ? "&" : "?"}t=${Date.now()}`;
  video.addEventListener("loadeddata", () => video.play().catch(() => {}));
  el.insertBefore(video, el.querySelector(".stamp"));
}

function showArm(arm, src) {
  lastVideos[arm] = src || null;
  if (src) showVideo(src, views[arm]); else showEmpty("—", views[arm]);
  $("replay").disabled = !(lastVideos["world-model"] || lastVideos.none);
}

function showBoth(videos) {
  const wmSrc = videos && (videos["world-model"] || videos.wm);
  const noneSrc = videos && (videos.none || videos.unverified || videos["no-world-model"]);
  showArm("world-model", wmSrc);
  showArm("none", noneSrc);
  for (const arm of ["world-model", "none"]) {
    if (lastStamps[arm]) {
      stamps[arm].className = lastStamps[arm].className;
      stamps[arm].textContent = lastStamps[arm].text;
    }
  }
}

const HANDLERS = {
  arm(d) {
    currentArm = d.arm;
    showEmpty("loading", views[d.arm]);
    stamps[d.arm].className = "stamp";
  },
  observed() {},
  plan(d) {
    if (d.action === "abstain" || d.shared) return;
    const arm = d.arm || currentArm;
    if (d.kind === "repair") rail(arm, "", "repair", d.after_miss ? "repaired after the miss" : "re-aimed the grasp");
    if (d.kind === "retry") rail(arm, "", "retry", "same plan again");
  },
  step(d) {
    rail(d.arm || currentArm, "", "step", `${d.index} of ${d.total} · ${d.object} → ${d.destination}`);
  },
  verdict(d) {
    const arm = d.arm || "world-model";
    const p = d.imagined_success_probability;
    rail(arm, d.approved ? "ok" : "no", "imagined",
         d.approved ? `p ${round(p)} · approve` : `p ${round(p)} · reject · ${d.likely_failure}`);
  },
  unverified(d) {
    const arm = d.arm || currentArm;
    if (arm === "none") return;
    rail(arm, "", "verifier", d.reason || "skipped");
  },
  executing(d) {
    const arm = d.arm || currentArm;
    const n = (d.attempt || 0) + 1;
    rail(arm, "", "run", n > 1 ? `executing · try ${n}` : "executing");
  },
  retrying(d) {
    const arm = d.arm || currentArm;
    rail(arm, "", "retry", `try ${d.attempt + 1} · from here`);
    showEmpty("loading", views[arm]);
    stamps[arm].className = "stamp";
  },
  executed(d) {
    const arm = d.arm || currentArm;
    const free = d.success === undefined;
    const n = (d.attempt || 0) + 1;
    rail(arm, d.success ? "ok" : "no", "run",
         free ? d.outcome : d.success ? `success · ${round(d.target_distance)} m`
                                      : (n > 1 ? `try ${n} · ${d.failure_mode}` : `${d.failure_mode}`));
    if (d.success !== false) setStamp(arm, d);
  },
  abstained: d => rail(d.arm || currentArm, "no", "abstain", d.reason),
  rejected: d => rail(d.arm || currentArm, "no", "blocked", d.reason),
  error: d => rail(d.arm || currentArm, "no", "error", d.reason),
  "arm-done"(d) {
    showArm(d.arm, d.video);
    setStamp(d.arm, d.execution);
  },
  done(d) {
    showBoth(d.videos || {});
    const results = d.results || {};
    if (results["world-model"]) setStamp("world-model", results["world-model"].execution);
    if (results.none) setStamp("none", results.none.execution);
  },
};

async function send(instruction) {
  if (busy || !instruction) return;
  const ac = new AbortController();
  abortCommand = ac;
  busy = true; $("send").disabled = true;
  clearRails();
  lastStamps = {};
  showEmpty("loading");
  rail("world-model", "", "plan", instruction);
  rail("none", "", "plan", instruction);

  try {
    const response = await fetch("/api/command", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ instruction }), signal: ac.signal,
    });
    const reader = response.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const line = buffer.slice(0, cut).replace(/^data: /, "");
        buffer = buffer.slice(cut + 2);
        if (!line) continue;
        const payload = JSON.parse(line);
        (HANDLERS[payload.event] || (() => {}))(payload);
      }
    }
  } catch (error) {
    if (error.name !== "AbortError") rail(currentArm, "no", "error", error.message);
  } finally {
    if (abortCommand === ac) abortCommand = null;
    busy = false; $("send").disabled = false;
    $("input").focus();
  }
}

$("form").addEventListener("submit", event => {
  event.preventDefault();
  const value = $("input").value.trim();
  $("input").value = "";
  if (!value) return;
  send(value);
});

$("reset").addEventListener("click", async () => {
  abortCommand?.abort();
  $("reset").disabled = true;
  clearRails();
  lastStamps = {};
  showEmpty("loading");
  try {
    const snapshot = await (await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" },
                                                       body: "{}" })).json();
    lastVideos = {}; $("replay").disabled = true;
    if (snapshot.video) showBoth({ "world-model": snapshot.video, none: snapshot.video });
    else showEmpty("—");
    $("seed").textContent = `seed ${snapshot.seed}`;
  } finally {
    $("reset").disabled = false;
  }
});

$("replay").addEventListener("click", () => showBoth(lastVideos));

fetch("/api/scene").then(r => r.json()).then(s => {
  $("seed").textContent = `seed ${s.seed}`;
  if (s.video) showBoth({ "world-model": s.video, none: s.video });
});
</script>
</body>
</html>
