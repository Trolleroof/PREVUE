<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waddle skill agent — talk to the arm</title>
<style>
  :root {
    --bg: #080c14; --panel: #101724; --line: #1e2a3d; --ink: #e6edf7; --dim: #8ea3bf;
    --accent: #4da3ff; --good: #2fd07f; --bad: #ff6b6b; --warn: #ffc857; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--ink);
         font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  .stage { flex: 1 1 55%; display: flex; flex-direction: column; padding: 22px; gap: 14px; min-width: 380px; }
  .side { flex: 1 1 45%; max-width: 620px; display: flex; flex-direction: column;
          border-left: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .viewport { flex: 1; display: grid; place-items: center; background: #05080f;
              border: 1px solid var(--line); border-radius: 14px; overflow: hidden; position: relative; }
  /* The frame fills the viewport; the square image and the square SVG overlay letterbox
     identically inside it (object-fit: contain and preserveAspectRatio agree), so the
     detection boxes land on the pixels they were measured from. */
  .frame { position: absolute; inset: 0; }
  .frame img, .frame video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .frame svg rect { fill: none; stroke: var(--accent); stroke-width: 1; }
  .frame svg text { fill: var(--accent); font: 7px var(--mono); }
  .badge { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px;
           background: #0009; border: 1px solid var(--line); font: 12px var(--mono); color: var(--dim);
           backdrop-filter: blur(6px); }
  .scene { font: 12px/1.7 var(--mono); color: var(--dim); white-space: pre-wrap; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button { background: #16203180; color: var(--ink); border: 1px solid var(--line); border-radius: 9px;
           padding: 7px 13px; font-size: 13px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #0c121d; }
  .msg.you { background: #16273f; border-color: #24405f; align-self: flex-end; max-width: 85%; }
  .msg .who { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .msg .note { color: var(--ink); }
  .msg.verdict { border-left: 3px solid var(--accent); }
  .msg.verdict.ok { border-left-color: var(--good); }
  .msg.verdict.no { border-left-color: var(--bad); }
  .msg.warn { border-left: 3px solid var(--warn); }
  .msg.err { border-left: 3px solid var(--bad); }
  .trace { font: 12px/1.7 var(--mono); color: var(--dim); margin-top: 8px; white-space: pre-wrap; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin-top: 8px;
           font: 12px var(--mono); color: var(--dim); }
  .stats b { color: var(--ink); font-weight: 500; }
  .bar { height: 5px; border-radius: 3px; background: #1b2637; margin-top: 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); }
  .bar i.no { background: var(--bad); }
  form { display: flex; gap: 8px; padding: 16px; border-top: 1px solid var(--line); background: #0b111b; }
  input { flex: 1; background: #0a0f18; border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 14px; color: var(--ink); font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  .hint { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 14px; }
  .hint button { font-size: 12px; color: var(--dim); padding: 5px 10px; }
  .spin { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
          animation: pulse 1s ease-in-out infinite; margin-right: 7px; vertical-align: middle; }
  @keyframes pulse { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
</style>
</head>
<body>
  <main class="stage">
    <h1>Waddle skill agent <small>Claude Opus 5 plans · the world model imagines · MuJoCo executes</small></h1>
    <div class="viewport" id="viewport"><span class="badge" id="badge">scene</span></div>
    <div class="controls">
      <button id="reset">New scene</button>
      <button id="live" disabled>Live view</button>
      <button id="replay" disabled>Replay episode</button>
      <button id="boxes">Detections</button>
      <span class="scene" id="seed"></span>
    </div>
    <div class="scene" id="scene"></div>
  </main>

  <aside class="side">
    <div class="log" id="log"></div>
    <div class="hint" id="hint"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Tell the arm what to do…" />
      <button id="send">Send</button>
    </form>
  </aside>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), viewport = $("viewport"), badge = $("badge");
let busy = false, lastVideo = null, live = true;

const EXAMPLES = [
  "pick up the red block and put it on the green pad",
  "grab the red block 3.5 cm to the -y side of its centre, then place it on the pad",
  "move the gripper over the blue block and hover there",
  "put the red block 25 cm to the left of the green pad",
];

function add(kind, who, html) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.innerHTML = `<div class="who">${who}</div>${html}`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

const round = (v, n = 3) => Number(v).toFixed(n);
const traceText = trace => trace.map(e =>
  e.target ? `${e.phase.padEnd(9)} → [${e.target.map(v => round(v)).join(", ")}]` : e.phase).join("\n");

const PERCEPTION_PX = 256;    // the detector's frame; the display render is the same square view
let detections = [], showBoxes = true;

function frame(child) {
  viewport.innerHTML = "";
  const box = document.createElement("div");
  box.className = "frame";
  box.appendChild(child);
  viewport.append(box, badge);
  return box;
}

function overlay(host) {
  if (!showBoxes || !detections.length) return;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${PERCEPTION_PX} ${PERCEPTION_PX}`);
  svg.innerHTML = detections.map(d => {
    const [x0, y0, x1, y1] = d.box;
    return `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="1"/>
            <text x="${x0}" y="${y0 - 2}">${d.label} · ${d.point_base.map(v => v.toFixed(2)).join(", ")}</text>`;
  }).join("");
  host.appendChild(svg);
}

function showLive() {
  // One long-lived MJPEG connection: the server pushes a frame for every simulated frame,
  // so this is the physics as it runs, not a snapshot.
  const img = new Image();
  img.src = "/api/live.mjpg?" + Date.now();
  overlay(frame(img));
  badge.textContent = "live · MuJoCo";
  live = true; $("live").disabled = true;
}

function showVideo(src) {
  const video = document.createElement("video");
  Object.assign(video, { src, autoplay: true, loop: true, muted: true, playsInline: true, controls: true });
  frame(video);
  badge.textContent = "recorded episode · 10 fps";
  lastVideo = src; $("replay").disabled = false;
  live = false; $("live").disabled = false;
}

function paintScene(snapshot) {
  detections = snapshot.detections || [];
  if (live) showLive();
  $("scene").textContent = snapshot.observation;
  $("seed").textContent = `seed ${snapshot.seed}`;
}

const HANDLERS = {
  observed(d) {
    detections = d.detections || [];
    add("", "Perception · bounding_box → detect_in_base",
      `<div class="trace">${detections.map(x =>
        `${x.label.padEnd(13)} box [${x.box.join(", ")}] px  →  [${x.point_base.map(v => round(v)).join(", ")}] m`
      ).join("\n")}</div>`);
  },
  plan(d) {
    add("", d.kind === "propose" ? "Claude · proposed plan" : "Claude · repair " + d.round,
        `<div class="note">${d.note}</div><div class="trace">${traceText(d.trace)}</div>`);
  },
  verdict(d) {
    const p = d.imagined_success_probability;
    add("verdict " + (d.approved ? "ok" : "no"), "World model · imagined outcome",
      `<div class="note">${d.approved ? "Approved" : "Rejected"} — ${d.likely_failure || "no failure predicted"}.
        ${d.verifier_suggestion ? d.verifier_suggestion + "." : ""}</div>
       <div class="bar"><i class="${d.approved ? "" : "no"}" style="width:${(p * 100).toFixed(0)}%"></i></div>
       <div class="stats">
         <span>p(success) <b>${round(p)}</b></span><span>uncertainty <b>${round(d.ensemble_uncertainty)}</b></span>
         <span>p(lifted) <b>${round(d.p_block_lifted)}</b></span><span>p(in zone) <b>${round(d.p_block_in_landing_zone)}</b></span>
         <span>imagined block xy <b>[${d.imagined_final_block_xy.map(v => round(v)).join(", ")}]</b></span>
       </div>`);
  },
  unverified: d => add("warn", "World model · skipped", `<div class="note">${d.reason}</div>`),
  executing() {
    if (!live) showLive();          // watch it happen, not the last replay
    add("", "MuJoCo", `<div class="note"><span class="spin"></span>executing the accepted trace…</div>`);
  },
  executed(d) {
    const free = d.success === undefined;
    add(free ? "" : "verdict " + (d.success ? "ok" : "no"), "MuJoCo · what really happened",
      `<div class="note">${free ? d.outcome : d.success ? "Success" : "Failed: " + d.failure_mode}</div>
       <div class="stats"><span>final block xy <b>[${d.final_block_xy.map(v => round(v)).join(", ")}]</b></span>
       <span>gripper <b>[${d.final_gripper_xyz.map(v => round(v, 2)).join(", ")}]</b></span>
       <span>distance to pad <b>${round(d.target_distance)} m</b></span>
       <span>max block z <b>${round(d.max_block_z)} m</b></span></div>`);
  },
  abstained: d => add("warn", "Claude · abstained", `<div class="note">${d.reason}</div>`),
  rejected: d => add("err", "Agent · not executed", `<div class="note">${d.reason}</div>`),
  error: d => add("err", "Error", `<div class="note">${d.reason}</div>`),
  done(d) {
    if (d.video) { lastVideo = d.video; $("replay").disabled = false; }   // the live view keeps running
    if (d.snapshot) { $("scene").textContent = d.snapshot.observation; detections = d.snapshot.detections || []; }
    if (live) showLive();                                                 // redraw the detection overlay
    add("", "Run", `<div class="stats"><span>decision <b>${d.decision}</b></span>
      <span>${d.seconds ? d.seconds + " s" : ""}</span>
      <span>${d.cost_usd != null ? "$" + d.cost_usd + " of Claude" : ""}</span>
      <span>${d.log ? d.log : ""}</span></div>`);
  },
};

async function send(instruction) {
  if (busy || !instruction) return;
  busy = true; $("send").disabled = $("reset").disabled = true;
  add("you", "You", `<div class="note">${instruction}</div>`);
  const waiting = add("", "Claude", `<div class="note"><span class="spin"></span>thinking…</div>`);

  const response = await fetch("/api/command", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ instruction }),
  });
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = "", first = true;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const line = buffer.slice(0, cut).replace(/^data: /, "");
      buffer = buffer.slice(cut + 2);
      if (!line) continue;
      const payload = JSON.parse(line);
      if (first && payload.event !== "observed") { waiting.remove(); first = false; }
      if (payload.event === "plan") { waiting.remove(); first = false; }
      (HANDLERS[payload.event] || (() => {}))(payload);
    }
  }
  waiting.remove();
  busy = false; $("send").disabled = $("reset").disabled = false;
  $("input").focus();
}

function submit(event) {
  event.preventDefault();
  const value = $("input").value.trim();
  $("input").value = "";
  send(value);
}

$("form").addEventListener("submit", submit);
$("input").addEventListener("keydown", event => { if (event.key === "Enter") submit(event); });

$("reset").addEventListener("click", async () => {
  const snapshot = await (await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" },
                                                     body: "{}" })).json();
  paintScene(snapshot);
  add("", "Scene", `<div class="note">New block pose sampled.</div><div class="trace">${snapshot.observation}</div>`);
});

$("replay").addEventListener("click", () => lastVideo && showVideo(lastVideo));

$("live").addEventListener("click", () => { showLive(); $("live").disabled = true; });

$("boxes").addEventListener("click", () => {
  showBoxes = !showBoxes;
  if (live) showLive();
});

EXAMPLES.forEach(text => {
  const button = document.createElement("button");
  button.textContent = text;
  button.addEventListener("click", () => send(text));
  $("hint").appendChild(button);
});

fetch("/api/scene").then(r => r.json()).then(paintScene);
</script>
</body>
</html>
