<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visual World Model</title>
<meta name="description" content="No verifier vs. visual world model, side by side, on the same instruction." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #080808;
    --panel-sub: #101010;
    --line: #222222;
    --line-subtle: #181818;
    --line-focus: #ffffff;
    --ink: #f4f4f5;
    --ink-muted: #a1a1aa;
    --ink-faint: #71717a;
    --font-serif: 'Newsreader', Charter, Georgia, serif;
    --font-mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace;
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* Header */
  header {
    height: 48px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .paper-title {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
    background: var(--panel-sub);
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  button.btn-academic {
    background: var(--panel-sub);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 11.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
  }

  button.btn-academic:hover:not(:disabled) {
    background: #1a1a1a;
    border-color: var(--line-focus);
    color: #ffffff;
  }

  button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Main Layout: two arms, side by side */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px 12px 0;
    min-height: 0;
  }

  .figure-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }

  .figure-panel.none-arm { border-color: #3a2020; }
  .figure-panel.wm-arm { border-color: #1d3b56; }

  .panel-caption {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line-subtle);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-muted);
  }

  .caption-title {
    font-weight: 500;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 14px;
  }

  .status-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: var(--radius);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: 1px solid var(--line);
    background: var(--panel-sub);
    color: var(--ink-muted);
  }

  .status-tag.approved { background: #ffffff; color: #000000; border-color: #ffffff; font-weight: 600; }
  .status-tag.rejected { background: #181818; color: #ffffff; border-color: #444444; }

  .panel-caption .status-tag { margin-left: auto; }

  .model-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .model-toggle button {
    background: var(--panel-sub);
    color: var(--ink-muted);
    border: none;
    padding: 4px 10px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    cursor: pointer;
  }

  .model-toggle button + button { border-left: 1px solid var(--line); }
  .model-toggle button.on { background: #ffffff; color: #000000; font-weight: 600; }

  .viewport-area {
    flex: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .viewport-area video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  .viewport-area video.active {
    display: block;
  }

  .viewport-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid var(--line);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .outcome-stamp {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    border-radius: var(--radius);
    display: none;
    white-space: nowrap;
    border: 1px solid;
    background: #000000;
    box-shadow: 0 4px 16px rgba(0,0,0,0.8);
  }

  .outcome-stamp.active { display: block; }
  .outcome-stamp.success { border-color: #ffffff; color: #ffffff; }
  .outcome-stamp.failure { border-color: #555555; color: #888888; }

  /* Telemetry Table */
  .telemetry-table {
    padding: 6px 14px;
    background: var(--panel);
    border-top: 1px solid var(--line-subtle);
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
  }

  .telemetry-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .telemetry-heading {
    font-size: 9px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .telemetry-value {
    font-weight: 500;
    color: var(--ink);
  }

  /* Per-arm trace rail */
  .rail {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    border-top: 1px solid var(--line-subtle);
    scroll-behavior: smooth;
  }

  .step { border-left: 2px solid var(--line); padding-left: 9px; font-size: 12.5px; }
  .step.no { border-left-color: #888888; }
  .step.ok { border-left-color: #ffffff; }
  .step.warn { border-left-color: #666666; }
  .step .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); }
  .step .v { color: var(--ink); }
  .step .v b { font-family: var(--font-mono); font-weight: 600; }
  .step .n { color: var(--ink-muted); font-family: var(--font-mono); font-size: 11px; margin-top: 1px; }

  /* Form Footer */
  .prompt-area {
    padding: 10px 12px 12px;
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .prompt-input {
    flex: 1;
    background: #000000;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 14px;
    transition: border-color 0.15s ease;
  }

  .prompt-input:focus {
    outline: none;
    border-color: var(--line-focus);
  }

  button.btn-submit {
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: var(--radius);
    padding: 0 16px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.btn-submit:hover:not(:disabled) {
    background: #e4e4e7;
  }

  .prompt-user {
    padding: 0 12px 8px;
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--ink-muted);
  }
  .prompt-user b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="paper-title">Visual World Model</div>
    <div class="header-actions">
      <span class="meta-tag" id="seedDisplay">seed 0</span>
      <div class="model-toggle" id="modelToggle">
        <button type="button" data-model="claude-opus-5" title="Full-size planner">Opus 5</button>
        <button type="button" data-model="claude-haiku-4-5-20251001" title="Small, cheap planner">Haiku 4.5</button>
      </div>
      <button type="button" class="btn-academic" id="resetBtn" title="Reset simulator state">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        Reset
      </button>
    </div>
  </header>

  <main>
    <section class="figure-panel none-arm" id="panelNone">
      <div class="panel-caption">
        <span class="caption-title">No verifier</span>
        <span class="status-tag" id="viewportStatusNone">Ready</span>
      </div>
      <div class="viewport-area" id="viewportBoxNone">
        <video id="simVideoNone" muted playsinline loop></video>
        <div class="viewport-placeholder" id="viewportPlaceholderNone">
          <div class="spinner" id="loadingSpinnerNone" style="display:none;"></div>
          <span id="placeholderTextNone">Same instruction, run unchecked</span>
        </div>
        <div class="outcome-stamp" id="outcomeStampNone"></div>
      </div>
      <div class="telemetry-table">
        <div class="telemetry-col">
          <span class="telemetry-heading">Target Error</span>
          <span class="telemetry-value" id="telDistNone">—</span>
        </div>
        <div class="telemetry-col">
          <span class="telemetry-heading">Max Lift</span>
          <span class="telemetry-value" id="telLiftNone">—</span>
        </div>
        <div class="telemetry-col">
          <span class="telemetry-heading">Outcome</span>
          <span class="telemetry-value" id="telDecisionNone">—</span>
        </div>
        <div class="telemetry-col">
          <span class="telemetry-heading">Cost</span>
          <span class="telemetry-value" id="telCostNone">—</span>
        </div>
      </div>
      <div class="rail" id="railNone"></div>
    </section>

    <section class="figure-panel wm-arm" id="panelWm">
      <div class="panel-caption">
        <span class="caption-title">World model</span>
        <span class="status-tag" id="viewportStatusWm">Ready</span>
      </div>
      <div class="viewport-area" id="viewportBoxWm">
        <video id="simVideoWm" muted playsinline loop></video>
        <div class="viewport-placeholder" id="viewportPlaceholderWm">
          <div class="spinner" id="loadingSpinnerWm" style="display:none;"></div>
          <span id="placeholderTextWm">Same instruction, imagined first</span>
        </div>
        <div class="outcome-stamp" id="outcomeStampWm"></div>
      </div>
      <div class="telemetry-table">
        <div class="telemetry-col">
          <span class="telemetry-heading">Target Error</span>
          <span class="telemetry-value" id="telDistWm">—</span>
        </div>
        <div class="telemetry-col">
          <span class="telemetry-heading">Max Lift</span>
          <span class="telemetry-value" id="telLiftWm">—</span>
        </div>
        <div class="telemetry-col">
          <span class="telemetry-heading">Outcome</span>
          <span class="telemetry-value" id="telDecisionWm">—</span>
        </div>
        <div class="telemetry-col">
          <span class="telemetry-heading">Cost</span>
          <span class="telemetry-value" id="telCostWm">—</span>
        </div>
      </div>
      <div class="rail" id="railWm"></div>
    </section>
  </main>

  <div class="prompt-user" id="lastInstruction"></div>
  <form class="prompt-area" id="promptForm">
    <input type="text" id="promptInput" class="prompt-input" placeholder="Enter instruction — runs on both arms, same scene..." autocomplete="off" />
    <button type="submit" id="sendBtn" class="btn-submit">Compare</button>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);

let isBusy = false;
let plannerModel = "claude-opus-5";

function setModelUI(model) {
  plannerModel = model;
  document.querySelectorAll("#modelToggle button").forEach(btn =>
    btn.classList.toggle("on", btn.dataset.model === model));
}

document.querySelectorAll("#modelToggle button").forEach(btn => {
  btn.addEventListener("click", async () => {
    if (isBusy || btn.dataset.model === plannerModel) return;
    const previous = plannerModel;
    setModelUI(btn.dataset.model);
    try {
      await fetch("/api/model", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: btn.dataset.model })
      });
    } catch (err) {
      console.error("Model switch failed:", err);
      setModelUI(previous);
    }
  });
});

/** DOM handles for one arm's panel, plus its own outcome/telemetry state. */
function sideEls(suffix) {
  return {
    video: $("simVideo" + suffix),
    placeholder: $("viewportPlaceholder" + suffix),
    placeholderText: $("placeholderText" + suffix),
    spinner: $("loadingSpinner" + suffix),
    outcome: $("outcomeStamp" + suffix),
    status: $("viewportStatus" + suffix),
    rail: $("rail" + suffix),
    telDist: $("telDist" + suffix),
    telLift: $("telLift" + suffix),
    telDecision: $("telDecision" + suffix),
    telCost: $("telCost" + suffix),
  };
}

const SIDES = { none: sideEls("None"), "world-model": sideEls("Wm") };

function appendStep(els, cls, key, value, note) {
  const div = document.createElement("div");
  div.className = "step " + cls;
  div.innerHTML = `<div class="k">${key}</div><div class="v">${value}</div>` +
                   (note ? `<div class="n">${note}</div>` : "");
  els.rail.appendChild(div);
  els.rail.scrollTop = els.rail.scrollHeight;
}

function setSimLoading(els, text) {
  els.video.classList.remove("active");
  els.placeholder.style.display = "flex";
  els.spinner.style.display = "block";
  els.placeholderText.textContent = text;
  els.status.textContent = "Processing";
}

function showSimVideo(els, src) {
  if (!src) return;
  els.spinner.style.display = "none";
  els.placeholder.style.display = "none";
  els.video.src = `${src}${src.includes("?") ? "&" : "?"}t=${Date.now()}`;
  els.video.classList.add("active");
  els.video.play().catch(() => {});
  els.status.textContent = "Playback";
}

function setOutcome(els, isSuccess, failureMode, targetDistance) {
  els.outcome.className = "outcome-stamp active " + (isSuccess ? "success" : "failure");
  const distText = targetDistance != null ? `${(Number(targetDistance) * 1000).toFixed(1)} mm` : "";
  if (isSuccess) {
    els.outcome.textContent = `SUCCESS · ${distText}`;
    els.telDecision.textContent = "Success";
    els.telDecision.style.color = "#ffffff";
  } else {
    els.outcome.textContent = `FAILURE (${failureMode || "MISSED"}) · ${distText}`;
    els.telDecision.textContent = "Failure";
    els.telDecision.style.color = "#888888";
  }
  if (targetDistance != null) els.telDist.textContent = distText || "—";
}

function clearOutcome(els) {
  els.outcome.className = "outcome-stamp";
  els.outcome.textContent = "";
  els.telDist.textContent = "—";
  els.telLift.textContent = "—";
  els.telDecision.textContent = "—";
  els.telCost.textContent = "—";
  els.rail.innerHTML = "";
}

/** One event-handler set per arm, closed over that arm's DOM. */
function makeHandlers(els) {
  return {
    observed(d) {
      const objects = d.detections ? d.detections.map(x => x.label).join(', ') : '';
      if (!objects) return;
      appendStep(els, "", "perception", "objects detected", `Detected: ${objects}`);
    },
    plan(d) {
      if (d.action === "abstain") return;
      const isRepair = d.kind === "repair";
      const label = isRepair ? `repair (turn ${Number(d.round || 0) + 1})` : "proposed plan";
      appendStep(els, isRepair ? "warn" : "", label, `<i>${d.intent || "—"}</i>`, d.note || "");
      if (isRepair) els.placeholderText.textContent = "Verifying repaired trajectory...";
    },
    step(d) {
      appendStep(els, "", `step ${d.index} of ${d.total}`, `Moving ${d.object} → ${d.destination}`);
    },
    verdict(d) {
      const isApproved = d.approved === true;
      const pSuccess = Math.round(Number(d.imagined_success_probability || 0) * 100);
      if (!isApproved) {
        const diag = d.likely_failure || "predicted trajectory failure";
        const suggestion = d.verifier_suggestion ? ` — ${d.verifier_suggestion}` : "";
        els.placeholderText.textContent = `Predicted miss (${pSuccess}%) · ${diag} · repairing...`;
        els.status.textContent = "Plan Rejected";
        appendStep(els, "no", "verdict · rejected", `p(success) <b>${pSuccess}%</b>`, diag + suggestion);
      } else {
        els.placeholderText.textContent = `Plan approved (${pSuccess}%) · simulating physics...`;
        appendStep(els, "ok", "verdict · approved", `p(success) <b>${pSuccess}%</b>`);
      }
    },
    executing(d) {
      els.status.textContent = "Executing";
      els.placeholderText.textContent = "Executing physical rollout...";
    },
    retrying(d) {
      appendStep(els, "warn", "retry", "re-centering grasp", "re-perceived nudged block and retrying");
    },
    executed(d) {
      if (d.max_block_z != null) els.telLift.textContent = `${(Number(d.max_block_z) * 100).toFixed(1)} cm`;
      if (d.target_distance != null) els.telDist.textContent = `${(Number(d.target_distance) * 1000).toFixed(1)} mm`;
    },
    "arm-done"(d) {
      if (d.video) showSimVideo(els, d.video);
      const execution = d.execution || {};
      const isSuccess = execution.success === true || (Array.isArray(execution.steps) && execution.steps.every(s => s.success));
      const lastStep = Array.isArray(execution.steps) ? execution.steps.at(-1) : execution;
      setOutcome(els, isSuccess, lastStep?.failure_mode, lastStep?.target_distance);
      if (d.cost_usd != null) els.telCost.textContent = `$${Number(d.cost_usd).toFixed(3)}`;
    },
    done(d) {
      if (d.video) showSimVideo(els, d.video);
      els.status.textContent = "Idle";
      if (d.cost_usd != null) els.telCost.textContent = `$${Number(d.cost_usd).toFixed(3)}`;
    },
    error(d) {
      appendStep(els, "no", "error", d.reason || "unknown execution error");
    },
  };
}

const HANDLERS = { none: makeHandlers(SIDES.none), "world-model": makeHandlers(SIDES["world-model"]) };

/** Set the live verifier mode, then stream one instruction through it into `els`. */
async function runArm(mode, instruction) {
  const els = SIDES[mode];
  const handlers = HANDLERS[mode];
  clearOutcome(els);
  setSimLoading(els, mode === "none" ? "Running unchecked..." : "Imagining the outcome...");

  await fetch("/api/verifier", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode }),
  });

  const res = await fetch("/api/command", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ instruction }),
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const line = buffer.slice(0, cut).replace(/^data: /, "");
      buffer = buffer.slice(cut + 2);
      if (!line) continue;
      try {
        const payload = JSON.parse(line);
        const fn = handlers[payload.event];
        if (fn) fn(payload);
      } catch (err) {
        console.error("Malformed SSE line:", line, err);
      }
    }
  }
}

async function sendInstruction(instruction) {
  if (isBusy || !instruction) return;
  isBusy = true;
  $("sendBtn").disabled = true;
  $("lastInstruction").innerHTML = `Running: <b>${instruction}</b>`;
  try {
    // Same scene both times: each /api/command resets to the same block layout,
    // so running "none" first and "world-model" second is a fair comparison.
    await runArm("none", instruction);
    await runArm("world-model", instruction);
  } catch (err) {
    console.error("Compare run failed:", err);
  } finally {
    isBusy = false;
    $("sendBtn").disabled = false;
    $("promptInput").focus();
  }
}

$("promptForm").addEventListener("submit", e => {
  e.preventDefault();
  const val = $("promptInput").value.trim();
  $("promptInput").value = "";
  if (val) sendInstruction(val);
});

$("resetBtn").addEventListener("click", async () => {
  $("resetBtn").disabled = true;
  clearOutcome(SIDES.none);
  clearOutcome(SIDES["world-model"]);
  setSimLoading(SIDES.none, "Resetting scene...");
  setSimLoading(SIDES["world-model"], "Resetting scene...");
  try {
    const snap = await (await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })).json();
    $("seedDisplay").textContent = `seed ${snap.seed}`;
    if (snap.video) { showSimVideo(SIDES.none, snap.video); showSimVideo(SIDES["world-model"], snap.video); }
  } catch (err) {
    console.error("Reset failed:", err);
  } finally {
    $("resetBtn").disabled = false;
  }
});

fetch("/api/scene")
  .then(r => r.json())
  .then(s => {
    $("seedDisplay").textContent = `seed ${s.seed}`;
    if (s.model) setModelUI(s.model);
    if (s.video) { showSimVideo(SIDES.none, s.video); showSimVideo(SIDES["world-model"], s.video); }
  })
  .catch(() => {});
</script>
</body>
</html>
